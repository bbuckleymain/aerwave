[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris"
description = "A native desktop media library and player built on Qt 6 and libmpv"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0",
    "mutagen>=1.47",
]

[project.scripts]
# An entry-point script is importable from any working directory, unlike
# `python -m aeris`, which resolves the package relative to the cwd.
aeris = "aeris.__main__:main"

[tool.setuptools]
packages = ["aeris"]

[tool.setuptools.dynamic]
version = { attr = "aeris.__version__" }
